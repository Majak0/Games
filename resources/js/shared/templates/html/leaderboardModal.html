<div class="arcade-modal" id="leaderboard-modal" hidden aria-hidden="true">
    <div class="arcade-modal__backdrop" data-close-modal></div>
    <div class="arcade-modal__panel arcade-panel" role="dialog" aria-modal="true" aria-labelledby="leaderboard-modal-title">
        <header class="arcade-modal__header">
            <div>
                <p class="arcade-end-badge mb-1">Classement</p>
                <h2 id="leaderboard-modal-title" class="arcade-modal__title">Top scores</h2>
            </div>
            <button type="button" class="arcade-modal__close" data-close-modal aria-label="Fermer">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </header>

        <label class="flex flex-col gap-1 text-sm mb-4">
            <span>Mode</span>
            <select id="leaderboard-modal-mode" class="arcade-select"></select>
        </label>

        <div class="arcade-tabs" role="tablist">
            <button type="button" class="arcade-tabs__tab arcade-tabs__tab--active" data-limit="10" role="tab" aria-selected="true">Top 10</button>
            <button type="button" class="arcade-tabs__tab" data-limit="100" role="tab" aria-selected="false">Top 100</button>
        </div>

        <p id="leaderboard-modal-subtitle" class="mt-4 text-sm text-zinc-400"></p>

        <div class="mt-3 overflow-x-auto max-h-[50vh] overflow-y-auto">
            <table class="arcade-score-table w-full text-sm">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Pseudo</th>
                        <th>Score</th>
                        <th>Temps</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-modal-rows"></tbody>
            </table>
        </div>
    </div>
</div>
