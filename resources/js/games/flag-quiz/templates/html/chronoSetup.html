<div class="arcade-screen min-h-screen flex flex-col items-center justify-center p-6 gap-8">
    <header class="relative z-10 text-center">
        <a href="/jeux/flag-quiz" class="arcade-btn arcade-btn--skip mb-6 inline-flex">
            <i class="bi bi-arrow-left"></i> Retour aux modes
        </a>
        <p class="arcade-end-badge mb-3">Contre-la-montre</p>
        <h1 class="arcade-end-title mb-2">Choisissez la durée</h1>
        <p class="text-sm text-zinc-400">Trouvez un maximum de drapeaux avant la fin du timer.</p>
    </header>
    <div class="relative z-10 grid grid-cols-2 gap-4 w-full max-w-lg">
        {{durations}}
    </div>
</div>
