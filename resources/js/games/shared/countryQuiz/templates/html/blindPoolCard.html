<a href="{{href}}" class="arcade-game-card">
    <div class="arcade-game-card__icon">
        <i class="bi bi-eye-slash-fill"></i>
    </div>
    <div class="arcade-game-card__content">
        <h2 class="arcade-game-card__title">{{label}}</h2>
        <p class="arcade-game-card__description">{{description}}</p>
    </div>
    <span class="arcade-game-card__badge">{{badge}}</span>
</a>
