<div class="arcade-screen min-h-screen flex flex-col items-center justify-center p-6 gap-6">
    <div class="relative z-10 w-full max-w-md arcade-panel">
        <p class="arcade-end-badge mb-3">Compte</p>
        <h1 class="arcade-end-title mb-4 text-center">Connexion</h1>
        <form id="login-form" class="flex flex-col gap-4">
            <label class="flex flex-col gap-1 text-sm">
                <span>Pseudo</span>
                <input id="login-username" type="text" autocomplete="username" class="arcade-input w-full" required>
            </label>
            <label class="flex flex-col gap-1 text-sm">
                <span>Mot de passe</span>
                <input id="login-password" type="password" autocomplete="current-password" class="arcade-input w-full" required>
            </label>
            <p id="login-error" class="text-sm font-bold arcade-feedback--error hidden"></p>
            <button type="submit" class="arcade-btn">Se connecter</button>
        </form>
        <p class="mt-4 text-center text-sm text-zinc-400">
            Pas encore de compte ?
            <a href="/compte/inscription" class="text-neon-green hover:underline">S'inscrire</a>
        </p>
        <p class="mt-3 text-center">
            <a href="/" class="arcade-btn arcade-btn--skip inline-flex"><i class="bi bi-arrow-left"></i> Accueil</a>
        </p>
    </div>
</div>
