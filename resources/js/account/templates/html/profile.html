<div class="arcade-screen min-h-screen flex flex-col p-6 gap-6">
    <header class="relative z-10 text-center max-w-5xl mx-auto w-full">
        <p class="arcade-end-badge mb-3">Compte</p>
        <h1 class="arcade-end-title mb-2">Bonjour, {{username}}</h1>        
        <p class="text-sm text-zinc-400">Vos scores et les classements publics.</p>
        <div class="mt-4 flex flex-wrap justify-center gap-3">
            <button id="logout-button" type="button" class="arcade-btn arcade-btn--danger">Déconnexion</button>
            <a href="/" class="arcade-btn arcade-btn--skip inline-flex"><i class="bi bi-arrow-left"></i> Accueil</a>
        </div>
        <div id="profile-game-buttons" class="mt-5 flex flex-wrap justify-center gap-3" role="group" aria-label="Type de jeu"></div>
        <div id="profile-mode-buttons" class="mt-3 flex flex-wrap justify-center gap-2" role="group" aria-label="Mode" hidden></div>
    </header>

    <section class="relative z-10 w-full max-w-4xl mx-auto arcade-panel overflow-x-auto">
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
                <h2 class="arcade-section-title mb-1">Mes meilleurs scores</h2>
                <p id="profile-score-subtitle" class="text-sm text-zinc-400"></p>
            </div>
            <div id="profile-chrono-durations" class="arcade-duration-picker flex flex-wrap justify-end gap-2" role="group" aria-label="Durée du contre-la-montre" hidden></div>
        </div>
        <table id="profile-score-table" class="arcade-score-table w-full text-sm">
            <thead>
                <tr>
                    <th data-score-header>Score</th>
                    <th class="arcade-score-table__time">Temps</th>
                    <th>Classement</th>
                </tr>
            </thead>
            <tbody id="profile-score-rows"></tbody>
        </table>
    </section>

    <section class="relative z-10 w-full max-w-4xl mx-auto arcade-panel">
        <h2 class="arcade-section-title mb-4">Classement public (top 100)</h2>
        <p id="leaderboard-title" class="text-sm text-zinc-400"></p>
        <div class="mt-3 overflow-x-auto">
            <table id="profile-leaderboard-table" class="arcade-score-table w-full text-sm">
                <thead>
                    <tr>
                        <th data-score-header>Score</th>
                        <th class="arcade-score-table__time">Temps</th>
                        <th>Classement</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-rows"></tbody>
            </table>
        </div>
    </section>
</div>
