<div class="arcade-screen min-h-screen flex flex-col items-center justify-center p-6 gap-6">
    <div class="relative z-10 w-full max-w-md arcade-panel">
        <p class="arcade-end-badge mb-3">Compte</p>
        <h1 class="arcade-end-title mb-4 text-center">Inscription</h1>
        <form id="register-form" class="flex flex-col gap-4">
            <label class="flex flex-col gap-1 text-sm">
                <span>Pseudonyme</span>
                <input id="register-username" type="text" autocomplete="username" class="arcade-input w-full" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+">
            </label>
            <label class="flex flex-col gap-1 text-sm">
                <span>Mot de passe (8 caractères min.)</span>
                <input id="register-password" type="password" autocomplete="new-password" class="arcade-input w-full" required minlength="8">
            </label>
            <label class="flex flex-col gap-1 text-sm">
                <span>Confirmer le mot de passe</span>
                <input id="register-password-confirmation" type="password" autocomplete="new-password" class="arcade-input w-full" required minlength="8">
            </label>
            <p id="register-error" class="text-sm font-bold arcade-feedback--error hidden"></p>
            <button type="submit" class="arcade-btn">Créer mon compte</button>
        </form>
        <p class="mt-4 text-center text-sm text-zinc-400">
            Déjà inscrit ?
            <a href="/compte/connexion" class="text-neon-green hover:underline">Se connecter</a>
        </p>
        <p class="mt-3 text-center">
            <a href="/" class="arcade-btn arcade-btn--skip inline-flex"><i class="bi bi-arrow-left"></i> Accueil</a>
        </p>
    </div>
</div>
