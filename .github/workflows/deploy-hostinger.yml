name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  # Racine Laravel sur Hostinger (document root = public/ à l'intérieur).
  # Ne pas déployer dans un sous-dossier Games/ : le site arcadiahub.fr
  # est servi depuis ce répertoire, pas depuis Games/.
  DEPLOY_PATH: /home/u663389318/domains/arcadiahub.fr

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, fileinfo, openssl, tokenizer
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Create deployment archive
        run: |
          mkdir -p deploy/output
          tar -C . -czf deploy/output/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='deploy/output' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache/data' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/pail' \
            .

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "SSH OK — $(whoami)@$(hostname)"
            BASE="${{ env.DEPLOY_PATH }}"
            if [ -f "$BASE/artisan" ]; then
              echo "Laravel root: $BASE"
            elif [ -f "$BASE/Games/artisan" ]; then
              echo "Laravel root: $BASE/Games"
            else
              echo "ATTENTION : artisan introuvable dans $BASE ni $BASE/Games"
            fi

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/output/deploy.tar.gz
          target: /tmp/
          # Sans strip_components, le fichier arrive dans /tmp/deploy/output/
          strip_components: 2

      - name: Extract and post-deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            ARCHIVE="/tmp/deploy.tar.gz"
            if [ ! -f "$ARCHIVE" ]; then
              ARCHIVE="/tmp/deploy/output/deploy.tar.gz"
            fi
            if [ ! -f "$ARCHIVE" ]; then
              echo "Archive introuvable. Contenu de /tmp :" >&2
              ls -laR /tmp/deploy* 2>/dev/null || ls -la /tmp/*.tar.gz 2>/dev/null || true
              exit 1
            fi

            BASE="${{ env.DEPLOY_PATH }}"
            if [ -f "$BASE/artisan" ]; then
              DEPLOY_PATH="$BASE"
            elif [ -f "$BASE/Games/artisan" ]; then
              DEPLOY_PATH="$BASE/Games"
            else
              echo "artisan introuvable dans $BASE ni $BASE/Games" >&2
              exit 1
            fi

            echo "Déploiement dans $DEPLOY_PATH (archive: $ARCHIVE)"
            cd "$DEPLOY_PATH"
            tar xzf "$ARCHIVE"
            rm -f "$ARCHIVE" /tmp/deploy/output/deploy.tar.gz 2>/dev/null || true
            bash deploy/hostinger/update.sh

      - name: Health check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" "https://arcadiahub.fr/up"
            HTML="$(curl -sfL "https://arcadiahub.fr/")"
            echo "$HTML" | grep -q 'id="contact-fab"' || {
              echo "ERREUR : la page d'accueil ne contient pas #contact-fab — mauvais DEPLOY_PATH ou cache obsolète." >&2
              exit 1
            }
            MANIFEST_HASH="$(grep -o 'app-[A-Za-z0-9_-]*\.js' <<< "$HTML" | head -1)"
            BASE="${{ env.DEPLOY_PATH }}"
            if [ -f "$BASE/artisan" ]; then
              DEPLOY_PATH="$BASE"
            else
              DEPLOY_PATH="$BASE/Games"
            fi
            DISK_HASH="$(grep -o 'app-[A-Za-z0-9_-]*\.js' "$DEPLOY_PATH/public/build/manifest.json" | head -1)"
            echo "Site: $MANIFEST_HASH — déployé: $DISK_HASH"
            test "$MANIFEST_HASH" = "$DISK_HASH" || {
              echo "ERREUR : les assets servis ne correspondent pas au build déployé." >&2
              exit 1
            }
